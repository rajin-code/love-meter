<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Meter 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    overflow:hidden;
    transition:0.5s;
    cursor:none;
}

.cursor{
    width:20px;
    height:20px;
    border-radius:50%;
    position:absolute;
    pointer-events:none;
    background:radial-gradient(circle,#ff4d6d,#ff758f);
    box-shadow:0 0 20px #ff4d6d;
    transform:translate(-50%,-50%);
}

.container{
    text-align:center;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    padding:40px 60px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h1{
    font-family:'Pacifico', cursive;
    font-size:38px;
    margin-bottom:20px;
    color:white;
}

input{
    padding:10px;
    border-radius:20px;
    border:none;
    margin-bottom:15px;
    text-align:center;
    outline:none;
}

button{
    padding:10px 25px;
    margin:8px;
    font-size:16px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background: linear-gradient(45deg,#ff4d6d,#ff758f);
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background: rgba(0,0,0,0.6);
    color:white;
    position:absolute;
}

.meter{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:20px;
    margin-top:15px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff4d6d,#ff758f);
    transition:1s;
}
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="container">
    <h1 id="question">Do you love me ( Rajin )? 💖</h1>
    <input type="text" id="nameInput" placeholder="Enter your name 😏">
    <br>
    <button id="yes">Yes ❤️</button>

    <div class="meter">
        <div class="fill" id="loveFill"></div>
    </div>
</div>

<button id="no">No 😜</button>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const fill = document.getElementById("loveFill");
const question = document.getElementById("question");
const nameInput = document.getElementById("nameInput");

// Runaway button
function moveButton(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

// Yes button action
yesBtn.addEventListener("click", function(){
    const name = nameInput.value || "Someone Special";
    question.innerHTML = `💘 Really !!! I can't believe it. 🥹 ${name}, every heartbeat whispers your name… 💖<br>
    🌹 The stars envy our love, and the moon smiles for us… 🌙<br>
    💘 My world is brighter because of you! 😌`;
    fill.style.width = "100%";

    confetti({
        particleCount:150,
        spread:100,
        origin:{ y:0.6 }
    });
});

// WhatsApp Share
function share(){
    const text = "I just tested my Love Meter 💖 Try it now!";
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}

// Cursor glow
const cursor = document.getElementById("cursor");
document.addEventListener("mousemove", e=>{
    cursor.style.left = e.pageX + "px";
    cursor.style.top = e.pageY + "px";
});
</script>

</body>
</html>
