<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">


<style>
:root {
    --primary: #ff3366;
    --secondary: #ff85a2;
}

body {
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(to bottom,#ff4e50,#fc913a);
    overflow:hidden;
    color:white;
}

.container{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(25px);
    padding:40px;
    border-radius:30px;
    text-align:center;
    width:90%;
    max-width:400px;
}

h1{
    font-family:'Dancing Script',cursive;
    font-size:2.5rem;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-bottom:2px solid rgba(255,255,255,0.3);
    background:transparent;
    color:white;
    text-align:center;
}

button{
    margin-top:15px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,var(--primary),var(--secondary));
    color:white;
    cursor:pointer;
}

.percent{
    font-size:3rem;
    color:#ffeb3b;
}

.heart{
    position:absolute;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Love Bond 💖</h1>
    <input id="name1" placeholder="Your Name">
    <input id="name2" placeholder="Your Partner Name">
    <button onclick="calculateLove()">Calculate</button>
    <div id="result"></div>
</div>

<script>

// ❤️ heart animation
function createHeart(){
    const h=document.createElement("div");
    h.innerHTML="❤️";
    h.className="heart";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(Math.random()*2+3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
}

// 📊 send data to Google Sheets
async function saveToSheet(n1, n2, percent){
    try{
        await fetch("https://script.google.com/macros/s/AKfycbwwaIyGerOBbbkroYg6uLlTITGLw8Cm4v7CEirtVxmDyW7LPSO22PosOd405U7RwBBU/exec", {
            method: "POST",
            body: JSON.stringify({
                name1: n1,
                name2: n2,
                percent: percent
            }),
            headers: {
                "Content-Type": "application/json"
            }
        });
    }catch(e){
        console.log("Sheet error:", e);
    }
}

// 💖 main function
async function calculateLove(){

    let n1=document.getElementById("name1").value.trim();
    let n2=document.getElementById("name2").value.trim();

    if(!n1 || !n2){
        alert("Enter both names!");
        return;
    }

    let combined=[n1.toLowerCase(),n2.toLowerCase()].sort().join("");
    let hash=0;

    for(let i=0;i<combined.length;i++){
        hash+=combined.charCodeAt(i)*(i+1);
    }

    let percent=(hash%61)+40;

    let result=document.getElementById("result");
    result.innerHTML=`<span class="percent" id="num">0%</span>`;

    let c=0;
    let interval=setInterval(async ()=>{
        if(c>=percent){
            clearInterval(interval);

            showMessage(percent);

            // 📊 save to Google Sheets
            await saveToSheet(n1, n2, percent);

            for(let i=0;i<30;i++) setTimeout(createHeart,i*100);
        }else{
            c++;
            document.getElementById("num").innerText=c+"%";
        }
    },25);
}

// 💬 message
function showMessage(p){
    let msg="";

    if(p>90) msg="Perfect Match 💞";
    else if(p>75) msg="Great Connection ✨";
    else if(p>60) msg="Good Bond 🔥";
    else msg="Keep Trying 😅";

    let d=document.createElement("div");
    d.innerText=msg;
    d.style.marginTop="10px";
    document.getElementById("result").appendChild(d);
}

</script>

</body>
</html>
